[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmable-peer-comparison"
version = "0.1.0"
description = "Compare one company AI adoption with a defined peer cohort."
requires-python = ">=3.11"
dependencies = ["firmable-api-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
firmable-peer-comparison = "peer_comparison.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
